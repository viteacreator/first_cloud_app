apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: lab-cloud-app
type: Opaque
stringData:
  DATABASE_URL: postgresql://cloud_user:cloud_pass@postgres:5432/cloud_lab
  JWT_SECRET: local-lab-secret-change-later
  TOKEN_HOURS: "12"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: lab-cloud-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/viteacreator/lab-ac-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: backend-secret
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 8
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: lab-cloud-app
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000
